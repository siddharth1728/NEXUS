<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NEXUS{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- CSRF Token for JavaScript fetches -->
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">NEXUS</div>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/profile">Profile</a></li>
            <!-- Placeholders for future phases -->
            <li class="disabled"><a href="#" title="Coming in Phase 2">Evidence</a></li>
            <li class="disabled"><a href="#" title="Coming in Phase 2">Projects</a></li>
            <li class="disabled"><a href="#" title="Coming in Phase 2">Skills Graph</a></li>
        </ul>
        <div class="nav-footer">
            <button id="logout-btn">Logout</button>
        </div>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
