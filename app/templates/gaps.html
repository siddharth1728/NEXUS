{% extends "base.html" %}
{% block title %}Unexplored — NEXUS{% endblock %}
{% block content %}
<div id="unexplored-page" style="max-width: 800px; margin: 0 auto;">
  <header class="page-header" style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px;">
    <div class="page-header-left">
      <div class="page-eyebrow" style="margin-bottom: 16px;">UNEXPLORED TERRITORY</div>
      <h1 class="page-title" style="font-family: 'Newsreader', serif; font-size: 32px; letter-spacing: -0.02em;">Unexplored</h1>
      <p class="page-subtitle" style="font-family: 'Inter', sans-serif;">Areas where NEXUS hasn't found enough evidence yet.</p>
    </div>
  </header>

  <div id="gaps-loading">
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
  </div>
  <div id="gaps-empty" class="hidden"></div>
  <div id="gaps-error" class="hidden"></div>
  <div id="gaps-content" class="hidden"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  async function loadGaps() {
    var loading = document.getElementById('gaps-loading');
    var empty = document.getElementById('gaps-empty');
    var error = document.getElementById('gaps-error');
    var content = document.getElementById('gaps-content');

    try {
      var gaps = await apiFetch('/api/gaps');
      loading.classList.add('hidden');

      if (!gaps || gaps.length === 0) {
        showEmptyState(empty, 'NO UNEXPLORED TERRITORY',
          'NEXUS has found evidence for all skills required by your target role, or you haven\'t set a target role yet.');
        empty.classList.remove('hidden');
        return;
      }

      var html = '<div style="display:flex; flex-direction:column; gap: 8px;">';

      gaps.forEach(function(g) {
        html += '<div style="display:flex; justify-content:space-between; align-items:center; padding: 16px; border: 1px dashed var(--muted); background: transparent;">';
        
        html += '<div style="display:flex; align-items:center; gap: 12px;">';
        html += '<span style="font-family:\'DM Mono\', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase;">' + escapeHtml(g.severity) + '</span>';
        html += '<span style="font-family:\'Inter\', sans-serif; font-weight: 500; font-size: 14px; color: var(--ink);">' + escapeHtml(g.skill) + '</span>';
        html += '</div>';
        
        html += '<div style="display:flex; gap: 12px; align-items: center;">';
        html += '<div style="display:flex; flex-direction: column; align-items: flex-end;">';
        html += '<span style="font-family:\'DM Mono\', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase;">Current</span>';
        html += '<span class="drawer-state-badge state-' + g.actual_state.toLowerCase() + '" style="margin:0;">' + escapeHtml(g.actual_state) + '</span>';
        html += '</div>';
        
        html += '<span style="color: var(--muted);">→</span>';
        
        html += '<div style="display:flex; flex-direction: column; align-items: flex-end;">';
        html += '<span style="font-family:\'DM Mono\', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase;">Required</span>';
        html += '<span class="drawer-state-badge state-' + g.required_state.toLowerCase() + '" style="margin:0;">' + escapeHtml(g.required_state) + '</span>';
        html += '</div>';
        html += '</div>';
        
        html += '</div>';
      });

      html += '</div>';

      // Context note
      html += '<div style="padding:24px; border: 1px solid var(--border); margin-top: 48px; background: transparent; text-align: center;">';
      html += '<div class="page-eyebrow mb-2">UNDERSTANDING GAPS</div>';
      html += '<p style="font-family:\'Inter\', sans-serif; font-size: 13px; color: var(--muted); line-height: 1.6;">';
      html += 'An unexplored area means NEXUS hasn\'t found enough evidence to match your target role requirements. ';
      html += 'This is <strong>not</strong> a claim about what you can or cannot do — it\'s a reflection of what NEXUS has observed. ';
      html += 'Sync more repositories or build new work to increase evidence visibility.';
      html += '</p></div>';

      content.innerHTML = html;
      content.classList.remove('hidden');

    } catch(err) {
      loading.classList.add('hidden');
      if (err.status === 401) { window.location.href = '/login'; return; }
      showError(error, 'Unable to load gaps', 'Please try again.');
      error.classList.remove('hidden');
    }
  }

  document.addEventListener('DOMContentLoaded', loadGaps);
})();
</script>
{% endblock %}
