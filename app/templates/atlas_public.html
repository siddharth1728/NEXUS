<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS Engineering Atlas — Public Projection</title>
  <meta name="description" content="Public read-only Technical Cartography Atlas projection.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    :root {
      --canvas-bg: #0d1117;
      --panel-bg: #161b22;
      --panel-border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-amber: #d29922;
    }
    body {
      background: var(--canvas-bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .atlas-public-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }
    .atlas-public-header {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .territory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .territory-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .territory-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin: 0 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.5rem;
    }
    .landmark-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .landmark-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.4rem;
    }
    .signal-pill {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      margin-right: 0.3rem;
      margin-bottom: 0.3rem;
    }
  </style>
</head>
<body>

  <div class="atlas-public-container">
    <div id="loading" style="text-align: center; padding: 4rem 0; color: var(--text-muted);">
      Loading public Technical Cartography Atlas...
    </div>

    <div id="content" style="display: none;">
      <header class="atlas-public-header">
        <div>
          <div style="font-family: monospace; font-size: 0.8rem; color: var(--accent-blue); margin-bottom: 0.3rem;">
            // PUBLIC CARTOGRAPHY ATLAS PROJECTION
          </div>
          <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0; color: #fff;">
            Engineering Atlas
          </h1>
          <div style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.3rem;" id="atlas-role">
            Software Engineer
          </div>
        </div>
        <div>
          <a href="/u/{{ public_slug }}" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--accent-blue); text-decoration: none; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--panel-border); padding: 0.5rem 1rem; border-radius: 6px;">
            ← Return to Passport
          </a>
        </div>
      </header>

      <div class="territory-grid" id="territories-container"></div>
    </div>

    <div id="error" style="display: none; text-align: center; padding: 4rem 1rem;">
      <h2 style="color: var(--accent-rust);">Atlas Unavailable</h2>
      <p style="color: var(--text-muted);">This public Atlas projection is private or unavailable.</p>
    </div>
  </div>

  <script>
    const publicSlug = "{{ public_slug }}";

    async function loadPublicAtlas() {
      try {
        const res = await fetch(`/api/public-profiles/${publicSlug}/atlas`);
        if (!res.ok) throw new Error("Unavailable");
        const data = await res.json();
        renderAtlas(data);
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
      }
    }

    function renderAtlas(data) {
      document.getElementById("atlas-role").textContent = `Destination Role: ${data.target_role || 'Software Engineer'}`;
      const container = document.getElementById("territories-container");
      container.innerHTML = "";

      if (!data.territories || data.territories.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1;">No public landmarks surveyed in this atlas.</p>`;
      } else {
        data.territories.forEach(t => {
          const card = document.createElement("div");
          card.className = "territory-card";
          
          let landmarksHtml = "";
          if (t.landmarks && t.landmarks.length > 0) {
            t.landmarks.forEach(lm => {
              const pills = lm.signals.map(s => `<span class="signal-pill">${s}</span>`).join("");
              landmarksHtml += `
                <div class="landmark-box">
                  <div class="landmark-title">📍 ${lm.project_name}</div>
                  <div style="margin-top: 0.4rem;">${pills || '<span style="color: var(--text-muted); font-size: 0.75rem;">Verified repository</span>'}</div>
                </div>
              `;
            });
          } else {
            landmarksHtml = `<p style="color: var(--text-muted); font-size: 0.85rem;">Territory explored with ${t.proven_count} verified signal(s).</p>`;
          }

          card.innerHTML = `
            <div class="territory-title">Territory: ${t.category}</div>
            ${landmarksHtml}
          `;
          container.appendChild(card);
        });
      }

      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";
    }

    document.addEventListener("DOMContentLoaded", loadPublicAtlas);
  </script>
</body>
</html>
