{% extends "base.html" %}

{% block title %}Onboarding | NEXUS{% endblock %}

{% block content %}
<div class="onboarding-container">
    <h2>Complete Your Profile</h2>
    <form id="onboarding-form">
        <div class="form-group">
            <label for="target_role">Target Role</label>
            <select id="target_role" required>
                <option value="">Select a role...</option>
                <option value="1">Backend Engineer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="github_username">GitHub Username (Optional)</label>
            <input type="text" id="github_username">
        </div>
        <button type="submit">Complete Setup</button>
        <p id="error-msg" class="error"></p>
    </form>
</div>
{% endblock %}
