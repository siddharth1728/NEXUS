<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NEXUS</title>
  <meta name="description" content="Sign in to your NEXUS engineering atlas.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-cartography-layout">
  
  <div class="auth-hero-section">
    <div class="auth-hero-brand">NEXUS // 2D ENGINEERING ATLAS</div>
    <h1 class="auth-hero-title">BUILD PROOF.<br>NOT JUST A RESUME.</h1>
    <p class="auth-hero-subtitle">
      Explore what your engineering work actually demonstrates. Connect your artifacts and map your capabilities deterministically.
    </p>
  </div>
  
  <div class="auth-form-section">
    <div class="auth-field-note">
      <div class="auth-field-note-title">AUTHENTICATION SURVEY</div>
      
      <div class="system-notice system-notice-error hidden" id="auth-error" role="alert" style="margin-bottom: 20px;">
        <span class="system-notice-title" id="auth-error-title">AUTHENTICATION FAILED</span>
        <span class="system-notice-desc" id="auth-error-desc">Invalid email or access key.</span>
      </div>
      
      <form id="login-form" novalidate style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
          <label class="form-label" for="email">Account Coordinate (Email)</label>
          <input type="email" id="email" name="email" class="form-input" required autofocus autocomplete="username" placeholder="engineer@example.com">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Access Key (Password)</label>
          <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>
        
        <button type="submit" class="auth-submit-btn" id="submit-btn">INITIALIZE SESSION</button>
      </form>
      
      <div class="auth-meta-links">
        <a href="/forgot-password">Reset access key</a>
        <a href="/register" style="color:var(--primary); font-weight:600;">Begin new survey →</a>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('login-form');
  var errorBox = document.getElementById('auth-error');
  var errorTitle = document.getElementById('auth-error-title');
  var errorDesc = document.getElementById('auth-error-desc');
  var submitBtn = document.getElementById('submit-btn');

  function showError(title, msg) {
    errorTitle.textContent = title;
    errorDesc.textContent = msg;
    errorBox.classList.remove('hidden');
    submitBtn.textContent = 'INITIALIZE SESSION';
    submitBtn.disabled = false;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorBox.classList.add('hidden');
    submitBtn.textContent = 'AUTHENTICATING...';
    submitBtn.disabled = true;

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      showError('VALIDATION FAILED', 'Both email coordinate and access key are required.');
      return;
    }

    try {
      await apiFetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });

      window.location.href = '/dashboard';
    } catch(err) {
      showError('ACCESS INTERRUPTION', err.detail || 'Invalid email or access key.');
    }
  });
});
</script>
</body>
</html>
