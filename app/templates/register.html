<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Begin Survey — NEXUS</title>
  <meta name="description" content="Create your NEXUS engineering atlas account.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-cartography-layout">
  
  <div class="auth-hero-section">
    <div class="auth-hero-brand">NEXUS // NEW SURVEY</div>
    <h1 class="auth-hero-title">BEGIN YOUR ENGINEERING MAP</h1>
    <p class="auth-hero-subtitle">
      Connect the work you've already built and discover what it proves. Generate a deterministic atlas of your engineering identity.
    </p>
  </div>
  
  <div class="auth-form-section">
    <div class="auth-field-note">
      <div class="auth-field-note-title">ORIGIN COORDINATES</div>
      
      <div class="system-notice system-notice-error hidden" id="register-error" role="alert" style="margin-bottom: 20px;">
        <span class="system-notice-title" id="register-error-title">INITIALIZATION FAILED</span>
        <span class="system-notice-desc" id="register-error-desc">Unable to create account.</span>
      </div>
      
      <form id="register-form" novalidate style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
          <label class="form-label" for="full_name">Engineer Name</label>
          <input type="text" id="full_name" class="form-input" required autocomplete="name" placeholder="Grace Hopper">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Account Coordinate (Email)</label>
          <input type="email" id="email" class="form-input" required autocomplete="username" placeholder="grace@example.com">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Access Key (Min 8 Characters)</label>
          <input type="password" id="password" class="form-input" required autocomplete="new-password" placeholder="••••••••">
        </div>
        
        <button type="submit" class="auth-submit-btn" id="submit-btn">BEGIN SURVEY</button>
      </form>
      
      <div class="auth-meta-links">
        <a href="/login" style="color:var(--primary); font-weight:600;">← Return to existing survey</a>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('register-form');
  var errorBox = document.getElementById('register-error');
  var errorTitle = document.getElementById('register-error-title');
  var errorDesc = document.getElementById('register-error-desc');
  var submitBtn = document.getElementById('submit-btn');

  function showError(title, msg) {
    errorTitle.textContent = title;
    errorDesc.textContent = msg;
    errorBox.classList.remove('hidden');
    submitBtn.textContent = 'BEGIN SURVEY';
    submitBtn.disabled = false;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorBox.classList.add('hidden');
    
    var name = document.getElementById('full_name').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!name || !email || !password) {
      showError('VALIDATION ERROR', 'All coordinate fields are required.');
      return;
    }
    if (password.length < 8) {
      showError('SECURITY ERROR', 'Access Key must be at least 8 characters long.');
      return;
    }

    submitBtn.textContent = 'INITIALIZING...';
    submitBtn.disabled = true;

    try {
      await apiFetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email, password: password })
      });

      // Auto-login
      await apiFetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });

      window.location.href = '/onboarding';

    } catch(err) {
      showError('REGISTRATION INTERRUPTED', err.detail || 'Could not register coordinates.');
    }
  });
});
</script>
</body>
</html>
