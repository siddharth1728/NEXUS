{% extends "base.html" %}
{% block title %}Proof — NEXUS{% endblock %}
{% block content %}
<div id="proof-page" style="max-width: 800px; margin: 0 auto;">
  <header class="page-header" style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px;">
    <div class="page-header-left">
      <div class="page-eyebrow" style="margin-bottom: 16px;">ENGINEERING PROOF</div>
      <h1 class="page-title" style="font-family: 'Newsreader', serif; font-size: 32px; letter-spacing: -0.02em;">Proof</h1>
      <p class="page-subtitle" style="font-family: 'Inter', sans-serif;">Evidence discovered by NEXUS across your projects.</p>
    </div>
  </header>

  <div id="proof-loading">
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
  </div>
  <div id="proof-empty" class="hidden"></div>
  <div id="proof-error" class="hidden"></div>
  <div id="proof-content" class="hidden" style="display: flex; flex-direction: column; gap: 40px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  async function loadProof() {
    var loading = document.getElementById('proof-loading');
    var empty = document.getElementById('proof-empty');
    var error = document.getElementById('proof-error');
    var content = document.getElementById('proof-content');

    try {
      var projects = await apiFetch('/api/projects/');
      loading.classList.add('hidden');

      if (!projects || projects.length === 0) {
        showEmptyState(empty, 'NO EVIDENCE PLOTTED',
          'Connect a project and survey it to discover engineering evidence.');
        empty.classList.remove('hidden');
        return;
      }

      var html = '';
      var hasEvidence = false;

      for (var i = 0; i < projects.length; i++) {
        var p = projects[i];
        var snapshots = await apiFetch('/api/projects/' + p.id + '/snapshots');

        if (snapshots.length === 0) continue;

        var latest = snapshots[0];
        var evidence;
        try {
          evidence = await apiFetch('/api/snapshots/' + latest.id + '/evidence');
        } catch(e) { continue; }

        if (!evidence || evidence.length === 0) continue;
        hasEvidence = true;

        html += '<div class="proof-ledger mb-8">';
        html += '<div style="font-family:\'DM Mono\', monospace; margin-bottom: 24px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; font-size:12px;">';
        html += '<span style="color:var(--muted); margin-right:8px;">PROJECT //</span>';
        html += '<span style="font-weight: 600; color:var(--ink);">' + escapeHtml(p.name) + '</span>';
        html += '</div>';

        evidence.forEach(function(e) {
          html += '<div class="proof-ledger-item">';
          html += '<div class="proof-ledger-grid">';
          
          html += '<div class="proof-ledger-label">WHAT WE FOUND</div>';
          html += '<div class="proof-ledger-value t-mono" style="font-size:12px;">' + escapeHtml(e.source_reference || 'Unknown Source') + '</div>';

          html += '<div class="proof-ledger-label mt-3">WHY IT MATTERS</div>';
          html += '<div class="proof-ledger-value mt-3">' + escapeHtml(e.raw_observation_text || 'Observation recorded during technical analysis.') + '</div>';

          html += '<div class="proof-ledger-label mt-3">WHAT IT PROVES</div>';
          html += '<div class="proof-ledger-value mt-3" style="display:flex; gap:8px; flex-wrap:wrap;">';
          if (e.skills && e.skills.length > 0) {
            e.skills.forEach(function(s) {
              html += '<span class="badge" style="background:var(--primary); color:#fff;">' + escapeHtml(s.name) + '</span>';
            });
          } else {
            html += '<span class="t-muted" style="font-style:italic;">General architectural insight</span>';
          }
          html += '</div>';

          html += '<div class="proof-ledger-label mt-3">CURRENT SIGNAL</div>';
          html += '<div class="proof-ledger-value mt-3" style="font-family:\'DM Mono\', monospace; font-size:11px; text-transform:uppercase; color:var(--muted);">';
          html += escapeHtml(e.type) + ' // QUALITY ' + ((e.quality_score || 0) * 100).toFixed(0) + '%';
          html += '</div>';
          
          html += '</div>'; // End proof-ledger-grid

          html += '<div class="proof-ledger-actions">';
          html += '<a href="/?skill=' + (e.skills && e.skills.length > 0 ? encodeURIComponent(e.skills[0].name) : '') + '" class="btn btn-secondary btn-sm">';
          html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg> LOCATE ON ATLAS';
          html += '</a>';
          html += '</div>';

          html += '</div>'; // End proof-ledger-item
        });
        html += '</div>';
      }

      if (!hasEvidence) {
        showEmptyState(empty, 'NO EVIDENCE FOUND',
          'Survey your projects to discover engineering evidence.');
        empty.classList.remove('hidden');
        return;
      }

      content.innerHTML = html;
      content.classList.remove('hidden');

    } catch(err) {
      loading.classList.add('hidden');
      if (err.status === 401) { window.location.href = '/login'; return; }
      showError(error, 'Unable to load proof', 'Please try again.');
      error.classList.remove('hidden');
    }
  }

  document.addEventListener('DOMContentLoaded', loadProof);
})();
</script>
{% endblock %}
