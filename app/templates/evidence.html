{% extends "base.html" %}
{% block title %}Proof — NEXUS{% endblock %}
{% block content %}
<div id="proof-page" style="max-width: 800px; margin: 0 auto;">
  <header class="page-header" style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px;">
    <div class="page-header-left">
      <div class="page-eyebrow" style="margin-bottom: 16px;">ENGINEERING PROOF</div>
      <h1 class="page-title" style="font-family: 'Newsreader', serif; font-size: 32px; letter-spacing: -0.02em;">Proof</h1>
      <p class="page-subtitle" style="font-family: 'Inter', sans-serif;">Evidence discovered by NEXUS across your projects.</p>
    </div>
  </header>

  <div id="proof-loading">
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
  </div>
  <div id="proof-empty" class="hidden"></div>
  <div id="proof-error" class="hidden"></div>
  <div id="proof-content" class="hidden" style="display: flex; flex-direction: column; gap: 40px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  async function loadProof() {
    var loading = document.getElementById('proof-loading');
    var empty = document.getElementById('proof-empty');
    var error = document.getElementById('proof-error');
    var content = document.getElementById('proof-content');

    try {
      var projects = await apiFetch('/api/projects/');
      loading.classList.add('hidden');

      if (!projects || projects.length === 0) {
        showEmptyState(empty, 'NO EVIDENCE PLOTTED',
          'Connect a project and survey it to discover engineering evidence.');
        empty.classList.remove('hidden');
        return;
      }

      var html = '';
      var hasEvidence = false;

      for (var i = 0; i < projects.length; i++) {
        var p = projects[i];
        var snapshots = await apiFetch('/api/projects/' + p.id + '/snapshots');

        if (snapshots.length === 0) continue;

        var latest = snapshots[0];
        var evidence;
        try {
          evidence = await apiFetch('/api/snapshots/' + latest.id + '/evidence');
        } catch(e) { continue; }

        if (!evidence || evidence.length === 0) continue;
        hasEvidence = true;

        html += '<div>';
        html += '<div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;">';
        html += '<div style="display:flex; align-items:center; gap: 12px;">';
        html += '<span style="width: 8px; height: 8px; border: 1px solid var(--primary); background: transparent; transform: rotate(45deg);"></span>';
        html += '<span style="font-family:\'DM Mono\', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--ink); text-transform: uppercase;">' + escapeHtml(p.name) + '</span>';
        html += '</div>';
        html += '</div>';

        html += '<div style="display:flex; flex-direction:column; gap: 1px; border-left: 1px solid var(--border); margin-left: 4px; padding-left: 16px;">';
        evidence.forEach(function(e) {
          html += '<div style="padding: 16px; border: 1px solid var(--border); background: var(--surface); position: relative;">';
          html += '<div style="position: absolute; left: -25px; top: 24px; width: 8px; height: 1px; background: var(--border);"></div>';
          
          html += '<div style="font-family:\'Inter\', sans-serif; font-size: 14px; color: var(--ink); margin-bottom: 12px;">' + escapeHtml(e.source_reference || '–') + '</div>';
          
          html += '<div style="display:flex; gap: 12px; margin-bottom: 12px;">';
          html += '<span style="font-family:\'DM Mono\', monospace; font-size: 9px; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--border); color: var(--muted);">' + escapeHtml(e.type) + '</span>';
          html += '<span style="font-family:\'DM Mono\', monospace; font-size: 9px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center;">Quality: ' + ((e.quality_score || 0) * 100).toFixed(0) + '%</span>';
          html += '</div>';

          if (e.skills && e.skills.length > 0) {
            html += '<div style="display:flex; gap: 8px; flex-wrap: wrap;">';
            e.skills.forEach(function(s) {
              html += '<span style="font-family:\'DM Mono\', monospace; font-size: 9px; text-transform: uppercase; padding: 2px 6px; background: var(--primary); color: #fff; border-radius: 2px;">' + escapeHtml(s.name) + '</span>';
            });
            html += '</div>';
          }
          html += '</div>';
        });
        html += '</div></div>';
      }

      if (!hasEvidence) {
        showEmptyState(empty, 'NO EVIDENCE FOUND',
          'Survey your projects to discover engineering evidence.');
        empty.classList.remove('hidden');
        return;
      }

      content.innerHTML = html;
      content.classList.remove('hidden');

    } catch(err) {
      loading.classList.add('hidden');
      if (err.status === 401) { window.location.href = '/login'; return; }
      showError(error, 'Unable to load proof', 'Please try again.');
      error.classList.remove('hidden');
    }
  }

  document.addEventListener('DOMContentLoaded', loadProof);
})();
</script>
{% endblock %}
