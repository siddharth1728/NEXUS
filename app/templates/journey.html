{% extends "base.html" %}
{% block title %}Journey — NEXUS{% endblock %}
{% block content %}
<div id="journey-page" style="max-width: 800px; margin: 0 auto;">
  <header class="page-header" style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px;">
    <div class="page-header-left">
      <div class="page-eyebrow" style="margin-bottom: 16px;">EXPEDITION LOG</div>
      <h1 class="page-title" style="font-family: 'Newsreader', serif; font-size: 32px; letter-spacing: -0.02em;">Expedition Log</h1>
      <p class="page-subtitle" style="font-family: 'Inter', sans-serif;">How your engineering identity has evolved over time.</p>
    </div>
  </header>

  <div id="journey-loading">
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
  </div>
  <div id="journey-empty" class="hidden"></div>
  <div id="journey-error" class="hidden"></div>
  <div id="journey-content" class="hidden"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  async function loadJourney() {
    var loading = document.getElementById('journey-loading');
    var empty = document.getElementById('journey-empty');
    var error = document.getElementById('journey-error');
    var content = document.getElementById('journey-content');

    try {
      var identity = await apiFetch('/api/identity');
      loading.classList.add('hidden');

      var journey = identity.engineering_journey;
      var transitions = journey ? journey.meaningful_transitions || [] : [];
      var discoveries = journey ? journey.recent_discoveries || [] : [];

      if (transitions.length === 0 && discoveries.length === 0) {
        showEmptyState(empty, 'YOUR JOURNEY BEGINS HERE',
          'Your engineering journey begins with your first NEXUS survey. ' +
          'Sync a project to start building your timeline.');
        empty.classList.remove('hidden');
        return;
      }

      var html = '<div class="journey-timeline">';

      // "You are here" marker at the top
      html += '<div class="journey-event" style="padding-bottom: 32px;">';
      html += '<div class="journey-event-dot" style="background: var(--surface); border: 2px solid var(--primary); width:12px; height:12px; left:-25px; top:2px;"></div>';
      html += '<div class="journey-event-time" style="color:var(--primary); font-weight:600;">◉ CURRENT LOCATION</div>';
      html += '<div class="journey-event-text">Your present engineering identity based on latest surveys.</div>';
      html += '</div>';

      // Transitions timeline
      if (transitions.length > 0) {
        transitions.forEach(function(t) {
          html += '<div class="journey-event">';
          html += '<div class="journey-event-dot journey-event-dot-transition"></div>';
          html += '<div class="journey-event-time">' + escapeHtml(formatRelativeTime(t.changed_at)) + '</div>';
          html += '<div class="journey-event-text">';
          html += '<span style="font-weight:600;">' + escapeHtml(t.skill_name) + '</span> evolved from ';
          html += '<span class="t-muted">' + escapeHtml(t.previous_state || 'NEW') + '</span> to ';
          html += '<span class="badge badge-' + t.new_state.toLowerCase() + '" style="margin-left:4px;">' + escapeHtml(t.new_state) + '</span>';
          html += '</div>';
          html += '</div>';
        });
      }

      // Recent discoveries
      if (discoveries.length > 0) {
        discoveries.forEach(function(d) {
          html += '<div class="journey-event">';
          html += '<div class="journey-event-dot journey-event-dot-discovery"></div>';
          html += '<div class="journey-event-time">RECENT DISCOVERY // ' + escapeHtml(d.type) + '</div>';
          html += '<div class="journey-event-text">' + escapeHtml(d.observation) + '</div>';
          html += '<div class="t-caption mt-2" style="font-family:\'DM Mono\', monospace;">' + escapeHtml(d.artifact_path.split('/').pop() || d.artifact_path) + '</div>';
          html += '</div>';
        });
      }
      
      html += '</div>';

      // Truth note
      html += '<div style="padding:24px; border: 1px dashed var(--border); margin-top: 48px; background: transparent; text-align: center;">';
      html += '<p style="font-family:\'Inter\', sans-serif; font-size: 13px; color: var(--muted); line-height: 1.6;">';
      html += 'This log reflects actual changes detected by NEXUS. ';
      html += 'Events are only recorded when skill states change as a result of new evidence.</p>';
      html += '</div>';

      content.innerHTML = html;
      content.classList.remove('hidden');

    } catch(err) {
      loading.classList.add('hidden');
      if (err.status === 401) { window.location.href = '/login'; return; }
      showError(error, 'Unable to load journey', 'Please try again.');
      error.classList.remove('hidden');
    }
  }

  document.addEventListener('DOMContentLoaded', loadJourney);
})();
</script>
{% endblock %}
