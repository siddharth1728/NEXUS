{% extends "base.html" %}
{% block title %}Signals — NEXUS{% endblock %}
{% block content %}
<div id="signals-page" style="max-width: 800px; margin: 0 auto;">
  <header class="page-header" style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px;">
    <div class="page-header-left">
      <div class="page-eyebrow" style="margin-bottom: 16px;">SURVEY LOG</div>
      <h1 class="page-title" style="font-family: 'Newsreader', serif; font-size: 32px; letter-spacing: -0.02em;">Extracted Signals</h1>
      <p class="page-subtitle" style="font-family: 'Inter', sans-serif;">Deterministic skill states derived from engineering evidence.</p>
    </div>
  </header>

  <div id="signals-loading">
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-row" style="margin-bottom:8px;"></div>
  </div>
  <div id="signals-empty" class="hidden"></div>
  <div id="signals-error" class="hidden"></div>
  <div id="signals-content" class="hidden"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  async function loadSignals() {
    var loading = document.getElementById('signals-loading');
    var empty = document.getElementById('signals-empty');
    var error = document.getElementById('signals-error');
    var content = document.getElementById('signals-content');

    try {
      var skills = await apiFetch('/api/skills');
      loading.classList.add('hidden');

      if (!skills || skills.length === 0) {
        showEmptyState(empty, 'NO SIGNALS DETECTED',
          'NEXUS hasn\'t calculated any skill signals yet. Sync a project to generate evidence.');
        empty.classList.remove('hidden');
        return;
      }

      var groups = { STRONG: [], DEVELOPING: [], WEAK: [], MISSING: [] };
      skills.forEach(function(s) {
        var state = s.state || 'MISSING';
        if (groups[state]) groups[state].push(s);
        else groups.MISSING.push(s);
      });

      var labels = { STRONG: 'Proven', DEVELOPING: 'Developing', WEAK: 'Weak', MISSING: 'Unexplored' };
      var html = '';

      ['STRONG', 'DEVELOPING', 'WEAK', 'MISSING'].forEach(function(state) {
        if (groups[state].length === 0) return;
        html += '<div style="margin-bottom: 40px;">';
        html += '<div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;">';
        html += '<span style="font-family:\'DM Mono\', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase;">' + escapeHtml(labels[state]) + '</span>';
        html += '<span style="font-family:\'DM Mono\', monospace; font-size: 11px; color: var(--muted);">' + groups[state].length + '</span>';
        html += '</div>';

        html += '<div style="display:flex; flex-direction:column; gap: 8px;">';
        groups[state].forEach(function(s) {
          html += '<div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 16px; border: 1px solid var(--border); background: var(--surface); cursor: pointer;" onclick="window.location.href=\'/evidence\'">';
          
          html += '<div style="display:flex; align-items:center; gap: 12px;">';
          html += '<span style="width: 8px; height: 8px; border-radius: 50%; display: inline-block; ' + 
                  (state==='STRONG'?'background:var(--signal-mint)':state==='DEVELOPING'?'background:var(--primary)':state==='WEAK'?'background:var(--amber)':'border: 1px dashed var(--muted)') + 
                  '"></span>';
          html += '<span style="font-family:\'Inter\', sans-serif; font-weight: 500; font-size: 14px; color: var(--ink);">' + escapeHtml(s.skill_name) + '</span>';
          html += '</div>';
          
          html += '<span class="drawer-state-badge state-' + state.toLowerCase() + '" style="margin:0;">' + escapeHtml(state) + '</span>';
          html += '</div>';
        });
        html += '</div></div>';
      });

      html += '<div style="padding:24px; border: 1px solid var(--border); margin-top: 48px; background: transparent; text-align: center;">';
      html += '<p style="font-family:\'Inter\', sans-serif; font-size: 13px; color: var(--muted); line-height: 1.6;">';
      html += 'Skill signals reflect what NEXUS has observed in your engineering work — not your absolute ability. ';
      html += 'An "Unexplored" state means NEXUS hasn\'t found enough evidence yet.</p>';
      html += '</div>';

      content.innerHTML = html;
      content.classList.remove('hidden');

    } catch(err) {
      loading.classList.add('hidden');
      if (err.status === 401) { window.location.href = '/login'; return; }
      showError(error, 'Unable to load signals', 'Please try again.');
      error.classList.remove('hidden');
    }
  }

  document.addEventListener('DOMContentLoaded', loadSignals);
})();
</script>
{% endblock %}
