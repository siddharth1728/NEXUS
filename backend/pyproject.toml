[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS: Context-to-Action Engine Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.32",
    "pgvector>=0.2.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "ARG001", # unused function arguments in FastAPI exception handlers / route signatures
    "UP046",  # PEP 695 generics - keep typing.Generic for Pydantic v2 compatibility
    "E501",   # line length formatted by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests do not need full return type annotations
module = [
    "tests",
    "tests.unit",
    "tests.unit.test_config",
    "tests.unit.test_errors",
    "tests.unit.test_logging",
    "tests.unit.test_schemas",
    "tests.unit.test_domain_and_repository",
    "tests.unit.test_db_session",
    "tests.integration",
    "tests.integration.test_health",
    "tests.integration.test_ready",
    "tests.integration.test_middleware",
    "tests.integration.test_errors_integration",
    "tests.conftest",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pydantic-mypy]
# init_forbid_extra disabled: pydantic-settings aliased field construction passes keyword aliases
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
